<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>馬場實戰筆記 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #060911; color: #e2e8f0; }
    .glass-card { background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .custom-scroll { overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .place-1 { background: #f59e0b; color: #000; }
    .place-2 { background: #94a3b8; color: #000; }
    .place-3 { background: #b45309; color: #fff; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16">

  <!-- 頂部導航 -->
  <header class="sticky top-0 z-30 glass-card border-b border-slate-800 px-3 py-2.5 shadow-md">
    <div class="max-w-5xl mx-auto space-y-2">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center space-x-2 shrink-0">
          <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
          <h1 class="text-sm font-black text-white flex items-center gap-1">
            <span>🏇 賽馬實戰</span>
            <span class="text-[9px] font-bold text-emerald-400 bg-emerald-950/90 px-1.5 py-0.2 rounded border border-emerald-700">PRO</span>
          </h1>
        </div>

        <!-- 搜尋欄 -->
        <div class="relative flex-1 max-w-xs mx-1">
          <input type="text" id="global-search" oninput="handleSearch(this.value)" placeholder="🔍 搜尋馬匹 / 騎師..." 
            class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl pl-3 pr-7 py-1 text-xs text-white placeholder-slate-400 outline-none">
          <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2 top-1 text-slate-400 hover:text-white text-xs">✕</button>
        </div>

        <!-- 爬蟲與登入按鈕 -->
        <div class="flex items-center space-x-1 shrink-0">
          <button type="button" onclick="triggerAutoScrape()" id="btn-auto-scrape" class="cursor-pointer text-[11px] bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-2.5 py-1 rounded-lg font-bold shadow flex items-center gap-1 transition">
            <span>⚡</span> <span>爬蟲</span>
          </button>
          <button type="button" onclick="openLoginModal()" id="btn-user-login" class="cursor-pointer text-[11px] bg-indigo-600/30 text-indigo-200 border border-indigo-500/40 px-2 py-1 rounded-lg font-bold">
            <span id="user-display-label">👤 登入</span>
          </button>
        </div>
      </div>

      <!-- 爬蟲進度顯示條 -->
      <div id="scrape-progress-bar" class="hidden bg-emerald-950/90 border border-emerald-600/50 rounded-lg px-2.5 py-1 flex items-center justify-between text-[11px] text-emerald-300">
        <div class="flex items-center space-x-1.5">
          <span class="animate-spin">⏳</span>
          <span id="scrape-progress-text">正在請求爬蟲更新...</span>
        </div>
      </div>

      <!-- 賽馬日橫排選單 -->
      <div id="meeting-nav-wrapper" class="hidden flex items-center space-x-1 pt-0.5">
        <div class="flex items-center space-x-1.5 custom-scroll py-0.5 flex-1" id="meeting-selector"></div>
      </div>

      <!-- 場次橫排選單 -->
      <div id="race-sticky-nav" class="hidden border-t border-slate-800/80 pt-1.5 flex items-center space-x-1">
        <button type="button" onclick="scrollContainer('race-selector-scroll', -140)" class="bg-slate-900 text-slate-400 px-1.5 py-1 text-xs rounded border border-slate-800 shrink-0">◀</button>
        <div id="race-selector-scroll" class="flex space-x-1.5 custom-scroll py-0.5 flex-1"></div>
        <button type="button" onclick="scrollContainer('race-selector-scroll', 140)" class="bg-slate-900 text-slate-400 px-1.5 py-1 text-xs rounded border border-slate-800 shrink-0">▶</button>
      </div>
    </div>
  </header>

  <!-- 主體區塊 -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 space-y-3">
    <!-- 搜尋結果區 -->
    <div id="search-results-panel" class="hidden glass-card rounded-xl p-3 border border-emerald-500/50 space-y-2">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <h3 class="text-xs font-black text-emerald-400" id="search-results-title">🔍 搜尋結果</h3>
        <button type="button" onclick="clearSearch()" class="text-[10px] text-slate-400 hover:text-white bg-slate-800 px-2 py-0.5 rounded">關閉 ✕</button>
      </div>
      <div id="search-results-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-72 overflow-y-auto pr-1"></div>
    </div>

    <!-- 尚未有資料時的引導畫面 -->
    <div id="empty-state" class="glass-card rounded-2xl p-6 text-center space-y-3 my-6 max-w-sm mx-auto border border-emerald-500/30">
      <div class="text-3xl">🏇⚡</div>
      <h2 class="text-base font-black text-white">準備就緒！一鍵抓取最新排位</h2>
      <p class="text-xs text-slate-400 leading-relaxed">點擊下方按鈕啟動爬蟲，自動獲取沙田/跑馬地/海外賽事排位。</p>
      <button type="button" onclick="triggerAutoScrape()" class="cursor-pointer w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">
        ⚡ 立即自動爬蟲更新
      </button>
    </div>

    <!-- 資料呈現區 -->
    <div id="loaded-state" class="hidden space-y-2.5">
      <div id="current-race-header" class="glass-card p-3 rounded-xl border-l-4 border-l-emerald-500 flex justify-between items-center"></div>
      <div class="flex items-center justify-between text-xs px-1">
        <div class="flex items-center space-x-2">
          <span class="text-slate-400">本場心水：</span>
          <span id="stat-current-picks" class="text-emerald-400 font-bold">未標記</span>
        </div>
        <button type="button" onclick="showMyPicksModal()" class="text-emerald-400 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
          <span>🎯 我的心水飛</span>
          <span id="stat-total-badge" class="bg-rose-500 text-white text-[9px] px-1.5 py-0.2 rounded-full font-black">0</span>
        </button>
      </div>
      <div id="horse-list" class="space-y-2.5"></div>
    </div>
  </main>

  <!-- 登入 Modal -->
  <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden pointer-events-none flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl max-w-sm w-full p-4 border border-slate-700 space-y-3 pointer-events-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-black text-white text-sm">👤 跨裝置心水同步</h3>
        <button type="button" onclick="closeLoginModal()" class="text-slate-400 text-sm">✕</button>
      </div>
      <div class="space-y-2 text-xs">
        <input type="text" id="login-username" placeholder="用戶名稱" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
        <input type="password" id="login-pin" placeholder="自訂密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
      </div>
      <div class="flex gap-2 pt-1">
        <button type="button" onclick="submitLogin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition">登入 / 同步</button>
        <button type="button" onclick="logoutUser()" id="btn-logout" class="hidden bg-rose-600/20 text-rose-300 border border-rose-500/30 px-3 py-2 rounded-xl text-xs font-bold">登出</button>
      </div>
    </div>
  </div>

  <!-- 心水飛 Modal -->
  <div id="picks-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden pointer-events-none flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl max-w-md w-full p-4 border border-slate-700 space-y-3 pointer-events-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-black text-white text-sm">📝 我標記的實戰心水</h3>
        <button type="button" onclick="closeMyPicksModal()" class="text-slate-400 text-sm">✕</button>
      </div>
      <div id="picks-modal-content" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-xs"></div>
      <button type="button" onclick="closeMyPicksModal()" class="bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs w-full">返回排位表</button>
    </div>
  </div>

  <script>
    let allMeetingsData = [];
    let currentMeetingIdx = 0;
    let currentRace = 1;
    let expandedHorses = {};
    let currentUser = JSON.parse(localStorage.getItem('horse_pro_user') || 'null');
    let userPicksMap = JSON.parse(localStorage.getItem('horse_pro_picks') || '{}');

    function getCurrentMeeting() { return allMeetingsData[currentMeetingIdx] || null; }
    function getPickKey(meetingId, raceNo, horseNo) { return `${meetingId}_R${raceNo}_${horseNo}`; }

    // 觸發爬蟲
    let pollTimer = null;
    async function triggerAutoScrape() {
      const progressBar = document.getElementById('scrape-progress-bar');
      const progressText = document.getElementById('scrape-progress-text');
      progressBar.classList.remove('hidden');
      progressText.innerText = '正在發送爬蟲請求...';

      try {
        const res = await fetch('/api/scrape', { method: 'POST' });
        if (!res.ok) throw new Error('伺服器回傳錯誤狀態: ' + res.status);
        const data = await res.json();
        progressText.innerText = data.progress || '爬蟲已在背景啟動...';

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(checkScrapeStatus, 1500);
      } catch (err) {
        progressBar.classList.add('hidden');
        alert('❌ 無法連接後端伺服器！請確認後端正在運行中。\n錯誤詳情: ' + err.message);
      }
    }

    async function checkScrapeStatus() {
      try {
        const res = await fetch('/api/scrape/status');
        const st = await res.json();
        document.getElementById('scrape-progress-text').innerText = st.progress || '正在處理中...';
        if (!st.is_running) {
          clearInterval(pollTimer);
          setTimeout(() => {
            document.getElementById('scrape-progress-bar').classList.add('hidden');
          }, 1500);
          await autoLoadFromServer();
        }
      } catch (e) {
        clearInterval(pollTimer);
      }
    }

    async function autoLoadFromServer() {
      try {
        const res = await fetch('/api/data');
        if (res.ok) {
          const data = await res.json();
          if (data && data.meetings && data.meetings.length > 0) {
            applyLoadedData(data);
            return;
          }
        }
      } catch (e) {}

      try {
        const ghRes = await fetch('https://raw.githubusercontent.com/chinhongtsang-ops/horse/main/race_data.json');
        if (ghRes.ok) {
          const data = await ghRes.json();
          applyLoadedData(data);
        }
      } catch (e) {}
    }

    function applyLoadedData(data) {
      if (!data || !data.meetings || data.meetings.length === 0) return;
      allMeetingsData = data.meetings;
      currentMeetingIdx = 0;
      currentRace = allMeetingsData[0].race_info[0]?.r || 1;
      expandedHorses = { [`0-${currentRace}-0`]: true };

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('loaded-state').classList.remove('hidden');
      document.getElementById('meeting-nav-wrapper').classList.remove('hidden');
      document.getElementById('race-sticky-nav').classList.remove('hidden');

      syncPicksToMeetings();
      renderAll();
    }

    function scrollContainer(id, offset) {
      const el = document.getElementById(id);
      if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function renderMeetingSelector() {
      const cur = getCurrentMeeting();
      if (!cur) return;
      const container = document.getElementById('meeting-selector');
      container.innerHTML = allMeetingsData.map((m, idx) => {
        const isActive = idx === currentMeetingIdx;
        const icon = m.is_simulcast ? '🌏' : '🏇';
        return `
          <button type="button" onclick="selectMeeting(${idx})" class="cursor-pointer px-2.5 py-1 rounded-lg text-xs font-bold shrink-0 flex items-center space-x-1 transition border ${isActive ? 'bg-emerald-600 text-white border-emerald-400 shadow' : 'bg-slate-900 text-slate-400 border-slate-800'}">
            <span>${icon}</span>
            <span>${m.label}</span>
          </button>
        `;
      }).join('');
    }

    function selectMeeting(idx) {
      currentMeetingIdx = idx;
      const cur = getCurrentMeeting();
      currentRace = cur.race_info[0]?.r || 1;
      renderAll();
    }

    function renderRaceSelector() {
      const cur = getCurrentMeeting();
      if (!cur) return;

      const container = document.getElementById('race-selector-scroll');
      container.innerHTML = (cur.race_info || []).map(r => {
        const isActive = r.r === currentRace;
        const labelText = r.btn_label || (cur.is_simulcast ? `${cur.course}-${r.r}` : `第 ${r.r} 場`);
        return `
          <button type="button" id="race-nav-${r.r}" onclick="selectRace(${r.r})" class="cursor-pointer px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 transition border ${isActive ? 'bg-emerald-600 text-white border-emerald-400 shadow' : 'bg-slate-900 text-slate-300 border-slate-800'}">
            ${labelText}
          </button>
        `;
      }).join('');

      setTimeout(() => {
        const activeBtn = document.getElementById(`race-nav-${currentRace}`);
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }, 50);
    }

    function selectRace(r) {
      currentRace = r;
      renderRaceCard();
      renderRaceSelector();
    }

    function toggleDrawer(key) {
      expandedHorses[key] = !expandedHorses[key];
      renderRaceCard();
    }

    function renderRaceCard() {
      const cur = getCurrentMeeting();
      if (!cur) return;

      const raceInfo = cur.race_info.find(r => r.r === currentRace) || cur.race_info[0] || { r: currentRace, name: "賽事", time: "-", cls: "-", dist: "-" };
      const horses = cur.races[String(currentRace)] || [];
      const raceTag = raceInfo.btn_label || `第 ${raceInfo.r} 場`;

      document.getElementById('current-race-header').innerHTML = `
        <div>
          <span class="text-[10px] text-emerald-400 font-bold block">${cur.venue} · ${raceTag} ${raceInfo.time !== '-' ? '· ' + raceInfo.time + ' 開跑' : ''}</span>
          <h2 class="text-sm font-black text-white mt-0.5">${raceInfo.name} ${raceInfo.cls !== '-' ? '(' + raceInfo.cls + ')' : ''}</h2>
        </div>
        <div class="text-right shrink-0">
          <span class="bg-slate-900 px-2 py-1 rounded text-xs font-bold text-slate-200 border border-slate-700">${raceInfo.dist} · ${horses.length} 匹</span>
        </div>
      `;

      const currentPicks = horses.filter(h => h.pick).map(h => `${h.no}.${h.name} (${h.pick})`).join(', ');
      document.getElementById('stat-current-picks').innerText = currentPicks || "未標記";

      const list = document.getElementById('horse-list');
      list.innerHTML = horses.map((h, idx) => {
        const key = `${currentMeetingIdx}-${currentRace}-${idx}`;
        const isOpen = !!expandedHorses[key];
        const ana = h.analysis || { style: "跟前守好位", draw_note: `${h.draw}檔`, wt_note: `${h.wt}磅`, track_apt: "草地好地", summary: "" };

        const runsHtml = (h.past_runs || []).map(run => `
          <tr class="border-b border-slate-800/60 text-[10px]">
            <td class="py-1"><span class="w-3.5 h-3.5 rounded-full inline-flex items-center justify-center font-bold ${run.place==='1'?'place-1':run.place==='2'?'place-2':run.place==='3'?'place-3':'bg-slate-800 text-slate-300'}">${run.place}</span></td>
            <td class="py-1 text-slate-400">${run.date}</td>
            <td class="py-1 text-white">${run.track} ${run.dist}</td>
            <td class="py-1 text-slate-300">${run.draw}檔</td>
            <td class="py-1 font-mono text-emerald-400">${run.pos}</td>
            <td class="py-1 text-slate-300">${run.lbw}</td>
            <td class="py-1 text-right">${run.replay_url ? `<a href="${run.replay_url}" target="_blank" class="text-amber-400 font-bold">▶片</a>` : '-'}</td>
          </tr>
        `).join('');

        const twHtml = (h.trackwork || []).map(tw => `
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800/80 text-[10px] flex justify-between">
            <span class="text-slate-300">${tw.date} · ${tw.type} (${tw.rider})</span>
            <span class="font-mono text-amber-300 font-bold">${tw.time}</span>
          </div>
        `).join('');

        return `
        <div id="horse-card-${idx}" class="glass-card rounded-xl p-3 border transition ${h.pick === '◎' ? 'border-rose-500/80' : h.pick === '▲' ? 'border-amber-500/80' : 'border-slate-800'}">
          <div class="flex justify-between items-start">
            <div class="flex items-center space-x-2">
              <span class="w-6 h-6 rounded-full bg-slate-800 text-white font-black text-xs flex items-center justify-center border border-slate-600 shrink-0">${h.no}</span>
              <div>
                <div class="flex items-center gap-1.5">
                  <h3 class="font-black text-sm text-white">${h.name}</h3>
                  ${h.draw && h.draw !== '-' ? `<span class="text-[10px] bg-slate-800 text-emerald-300 px-1 py-0.2 rounded border border-slate-700">${h.draw}檔</span>` : ''}
                  ${h.gear ? `<span class="text-[9px] bg-purple-500/20 text-purple-300 px-1 py-0.2 rounded">${h.gear}</span>` : ''}
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5">騎：<strong class="text-slate-200">${h.jockey}</strong> (${h.wt}) · 練：${h.trainer} · 分：${h.rtg}</p>
              </div>
            </div>
            ${h.pick ? `<span class="px-1.5 py-0.2 rounded text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">${h.pick}</span>` : ''}
          </div>

          <!-- 分析標籤 -->
          <div class="grid grid-cols-3 gap-1 mt-2 pt-1.5 border-t border-slate-800/60 text-[10px]">
            <div class="bg-slate-900/80 p-1 rounded text-center border border-slate-800">
              <span class="text-slate-400 block text-[9px]">擅長跑法</span>
              <strong class="text-amber-400">${ana.style}</strong>
            </div>
            <div class="bg-slate-900/80 p-1 rounded text-center border border-slate-800">
              <span class="text-slate-400 block text-[9px]">檔位/負磅</span>
              <strong class="text-emerald-400 truncate block">${ana.draw_note}</strong>
            </div>
            <div class="bg-slate-900/80 p-1 rounded text-center border border-slate-800">
              <span class="text-slate-400 block text-[9px]">場地性能</span>
              <strong class="text-sky-300">${ana.track_apt}</strong>
            </div>
          </div>

          <!-- 展開往績抽屜 -->
          <button type="button" onclick="toggleDrawer('${key}')" class="cursor-pointer mt-2 w-full bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-lg py-1 px-2.5 flex justify-between items-center text-[10px] font-bold text-emerald-400">
            <span>📊 往績 (${(h.past_runs||[]).length}) · ⏱️ 晨課 (${(h.trackwork||[]).length}) · 🎬 片庫</span>
            <span>${isOpen ? '▲ 收起' : '▼ 展開詳情'}</span>
          </button>

          ${isOpen ? `
            <div class="mt-2 pt-2 border-t border-slate-800 space-y-2">
              <div class="grid grid-cols-3 gap-1 text-[10px]">
                <a href="${h.videos?.bt_video || '#'}" target="_blank" class="bg-indigo-600/20 text-indigo-300 py-1 rounded text-center">🐎 試閘片</a>
                <a href="${h.videos?.last_race_replay || '#'}" target="_blank" class="bg-rose-600/20 text-rose-300 py-1 rounded text-center">▶️ 上仗片</a>
                <a href="${h.videos?.patrol_video || '#'}" target="_blank" class="bg-amber-600/20 text-amber-300 py-1 rounded text-center">🎥 走位片</a>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <tbody>${runsHtml || '<tr><td class="text-slate-500 text-[10px] py-1">暫無往績資料</td></tr>'}</tbody>
                </table>
              </div>
              <div class="space-y-1">${twHtml || '<p class="text-slate-500 text-[10px]">暫無晨課資料</p>'}</div>
            </div>
          ` : ''}

          <!-- 心水按鈕 -->
          <div class="mt-2 flex items-center justify-between pt-1.5 border-t border-slate-800/60">
            <span class="text-[10px] text-slate-400">心水標記：</span>
            <div class="flex space-x-1">
              ${['◎ 本命', '○ 配腳', '▲ 黑馬'].map(tag => {
                const sym = tag.split(' ')[0];
                const isSelected = h.pick === sym;
                return `<button type="button" onclick="togglePick(${currentRace}, ${idx}, '${sym}')" class="cursor-pointer px-2 py-0.5 rounded text-[10px] font-bold ${isSelected ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'}">${tag}</button>`;
              }).join('')}
            </div>
          </div>
        </div>
      `}).join('');
    }

    async function togglePick(raceNo, horseIdx, symbol) {
      const cur = getCurrentMeeting();
      if (!cur) return;
      const list = cur.races[String(raceNo)];
      if (!list || !list[horseIdx]) return;

      const horse = list[horseIdx];
      horse.pick = horse.pick === symbol ? "" : symbol;

      const pk = getPickKey(cur.id, raceNo, horse.no);
      if (horse.pick) userPicksMap[pk] = horse.pick;
      else delete userPicksMap[pk];

      localStorage.setItem('horse_pro_picks', JSON.stringify(userPicksMap));
      updatePickBadge();
      renderRaceCard();
    }

    function updatePickBadge() {
      let total = 0;
      allMeetingsData.forEach(m => {
        Object.keys(m.races || {}).forEach(r => {
          (m.races[r] || []).forEach(h => { if (h.pick) total++; });
        });
      });
      document.getElementById('stat-total-badge').innerText = total;
    }

    function syncPicksToMeetings() {
      allMeetingsData.forEach(m => {
        Object.keys(m.races || {}).forEach(r => {
          (m.races[r] || []).forEach(h => {
            const pk = getPickKey(m.id, r, h.no);
            h.pick = userPicksMap[pk] || h.pick || "";
          });
        });
      });
      updatePickBadge();
    }

    function showMyPicksModal() {
      const modal = document.getElementById('picks-modal');
      const content = document.getElementById('picks-modal-content');
      let html = '';
      allMeetingsData.forEach((m, mIdx) => {
        Object.keys(m.races || {}).forEach(r => {
          (m.races[r] || []).forEach((h, hIdx) => {
            if (h.pick) {
              const rPrefix = m.is_simulcast ? `${m.course}-R${r}` : `第 ${r} 場`;
              html += `
                <div onclick="closeMyPicksModal(); jumpToHorse(${mIdx}, ${r}, ${hIdx});" class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer">
                  <div>
                    <span class="text-[10px] text-slate-400 block">${m.label} · ${rPrefix}</span>
                    <span class="font-bold text-white text-xs">${h.no}號 ${h.name}</span> <span class="text-[10px] text-slate-400">(${h.jockey})</span>
                  </div>
                  <span class="px-2 py-0.5 bg-rose-500/20 text-rose-300 rounded font-bold text-xs">${h.pick}</span>
                </div>`;
            }
          });
        });
      });
      content.innerHTML = html || '<p class="text-slate-400 text-center py-4">暫時未標記任何心水！</p>';
      modal.classList.remove('hidden', 'pointer-events-none');
    }

    function closeMyPicksModal() {
      const modal = document.getElementById('picks-modal');
      modal.classList.add('hidden', 'pointer-events-none');
    }

    function openLoginModal() {
      const modal = document.getElementById('login-modal');
      modal.classList.remove('hidden', 'pointer-events-none');
    }

    function closeLoginModal() {
      const modal = document.getElementById('login-modal');
      modal.classList.add('hidden', 'pointer-events-none');
    }

    function renderAll() {
      renderMeetingSelector();
      renderRaceSelector();
      renderRaceCard();
    }

    // 初始化啟動
    autoLoadFromServer();
  </script>
</body>
</html>
