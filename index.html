<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>馬場實戰筆記 Pro · 手機極致版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #060911; color: #e2e8f0; }
    .glass-card { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    
    /* 專為手機優化嘅極簡滑動條 */
    .custom-scroll {
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .custom-scroll::-webkit-scrollbar { display: none; }

    .place-1 { background: #f59e0b; color: #000; }
    .place-2 { background: #94a3b8; color: #000; }
    .place-3 { background: #b45309; color: #fff; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16">

  <!-- ==================== 頂部導航與功能區 ==================== -->
  <header class="sticky top-0 z-40 glass-card border-b border-slate-800 px-3 py-2.5 shadow-md">
    <div class="max-w-5xl mx-auto space-y-2">
      
      <!-- 第一行：標題 + 搜尋欄 + 操作按鈕 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center space-x-2 shrink-0">
          <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
          <div>
            <h1 class="text-sm font-black text-white flex items-center gap-1">
              <span>🏇 賽馬實戰</span>
              <span class="text-[9px] font-bold text-emerald-400 bg-emerald-950/90 px-1.5 py-0.2 rounded border border-emerald-700">PRO</span>
            </h1>
          </div>
        </div>

        <!-- 搜尋欄 (支援全港現役所有馬匹 / 騎師 / 練馬師) -->
        <div class="relative flex-1 max-w-xs mx-1">
          <input type="text" id="global-search" oninput="handleSearch(this.value)" placeholder="🔍 搜尋所有馬匹(如金鑽貴人) / 騎師..." 
            class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl pl-3 pr-7 py-1 text-xs text-white placeholder-slate-400 outline-none">
          <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2 top-1 text-slate-400 hover:text-white text-xs">✕</button>
        </div>

        <!-- 按鈕組：爬蟲 + 登入 -->
        <div class="flex items-center space-x-1 shrink-0">
          <button onclick="triggerAutoScrape()" id="btn-auto-scrape" class="text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded-lg font-bold shadow flex items-center gap-1">
            <span>⚡</span> <span>爬蟲</span>
          </button>
          <button onclick="openLoginModal()" id="btn-user-login" class="text-[11px] bg-indigo-600/30 text-indigo-200 border border-indigo-500/40 px-2 py-1 rounded-lg font-bold">
            <span id="user-display-label">👤 登入</span>
          </button>
        </div>
      </div>

      <!-- 爬蟲實時進度條 -->
      <div id="scrape-progress-bar" class="hidden bg-emerald-950/90 border border-emerald-600/50 rounded-lg px-2.5 py-1 flex items-center justify-between text-[11px] text-emerald-300">
        <div class="flex items-center space-x-1.5">
          <span class="animate-spin">⏳</span>
          <span id="scrape-progress-text">正在並發抓取馬會最新排位與晨課...</span>
        </div>
      </div>

      <!-- 第二行：賽馬日切換橫排 (本地 ST/HV + 海外 S1/S2) -->
      <div id="meeting-nav-wrapper" class="hidden flex items-center space-x-1 pt-0.5">
        <div class="flex items-center space-x-1.5 custom-scroll py-0.5 flex-1" id="meeting-selector"></div>
      </div>

      <!-- 第三行：【手機救星】場次橫排選單 (直接釘在頂部，秒速切換) -->
      <div id="race-sticky-nav" class="hidden border-t border-slate-800/80 pt-1.5 flex items-center space-x-1">
        <button onclick="scrollContainer('race-selector-scroll', -140)" class="bg-slate-900 text-slate-400 px-1.5 py-1 text-xs rounded border border-slate-800 shrink-0">◀</button>
        <div id="race-selector-scroll" class="flex space-x-1.5 custom-scroll py-0.5 flex-1"></div>
        <button onclick="scrollContainer('race-selector-scroll', 140)" class="bg-slate-900 text-slate-400 px-1.5 py-1 text-xs rounded border border-slate-800 shrink-0">▶</button>
      </div>

    </div>
  </header>

  <!-- ==================== 主體內容區 ==================== -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 space-y-3">

    <!-- 全港馬匹搜尋結果專區 -->
    <div id="search-results-panel" class="hidden glass-card rounded-xl p-3 border border-emerald-500/50 space-y-2">
      <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
        <h3 class="text-xs font-black text-emerald-400" id="search-results-title">🔍 搜尋結果</h3>
        <button onclick="clearSearch()" class="text-[10px] text-slate-400 hover:text-white bg-slate-800 px-2 py-0.5 rounded">關閉 ✕</button>
      </div>
      <div id="search-results-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-72 overflow-y-auto pr-1"></div>
    </div>

    <!-- 狀態 A：空數據引導 -->
    <div id="empty-state" class="glass-card rounded-2xl p-6 text-center space-y-3 my-6 max-w-sm mx-auto border border-emerald-500/30">
      <div class="text-3xl">🏇⚡</div>
      <h2 class="text-base font-black text-white">準備就緒！一鍵抓取最新排位</h2>
      <p class="text-xs text-slate-400 leading-relaxed">點擊下方按鈕即可啟動高速並發爬蟲，自動獲取沙田/跑馬地/海外轉播賽事數據。</p>
      <button onclick="triggerAutoScrape()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs shadow transition">
        ⚡ 立即自動爬蟲更新
      </button>
    </div>

    <!-- 狀態 B：已載入排位介面 -->
    <div id="loaded-state" class="hidden space-y-2.5">

      <!-- 當前場次資訊頭條 (精準顯示真實標題) -->
      <div id="current-race-header" class="glass-card p-3 rounded-xl border-l-4 border-l-emerald-500 flex justify-between items-center"></div>

      <!-- 心水統計簡易條 -->
      <div class="flex items-center justify-between text-xs px-1">
        <div class="flex items-center space-x-2">
          <span class="text-slate-400">本場心水：</span>
          <span id="stat-current-picks" class="text-emerald-400 font-bold">未標記</span>
        </div>
        <button onclick="showMyPicksModal()" class="text-emerald-400 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg font-bold flex items-center gap-1">
          <span>🎯 我的心水飛</span>
          <span id="stat-total-badge" class="bg-rose-500 text-white text-[9px] px-1.5 py-0.2 rounded-full font-black">0</span>
        </button>
      </div>

      <!-- 馬匹排位列表 (手機單欄緊湊卡片) -->
      <div id="horse-list" class="space-y-2.5"></div>

    </div>
  </main>

  <!-- ==================== 跨裝置登入 Modal ==================== -->
  <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl max-w-sm w-full p-4 border border-slate-700 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-black text-white text-sm">👤 跨裝置心水同步</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 text-sm">✕</button>
      </div>
      <p class="text-xs text-slate-400 leading-relaxed">輸入帳號與密碼即可隨時跨手機/電腦同步你標記的「◎本命 / ○配腳 / ▲黑馬」。</p>
      <div class="space-y-2 text-xs">
        <input type="text" id="login-username" placeholder="用戶名稱" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
        <input type="password" id="login-pin" placeholder="自訂密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white outline-none">
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="submitLogin()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs transition">登入 / 同步</button>
        <button onclick="logoutUser()" id="btn-logout" class="hidden bg-rose-600/20 text-rose-300 border border-rose-500/30 px-3 py-2 rounded-xl text-xs font-bold">登出</button>
      </div>
    </div>
  </div>

  <!-- ==================== 心水飛總覽 Modal ==================== -->
  <div id="picks-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl max-w-md w-full p-4 border border-slate-700 space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-black text-white text-sm">📝 我標記的實戰心水</h3>
        <button onclick="closeMyPicksModal()" class="text-slate-400 text-sm">✕</button>
      </div>
      <div id="picks-modal-content" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-xs"></div>
      <button onclick="closeMyPicksModal()" class="bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs w-full">返回排位表</button>
    </div>
  </div>

  <script>
    let allMeetingsData = [];
    let currentMeetingIdx = 0;
    let currentRace = 1;
    let expandedHorses = {};
    let currentUser = JSON.parse(localStorage.getItem('horse_pro_user') || 'null');
    let userPicksMap = JSON.parse(localStorage.getItem('horse_pro_picks') || '{}');

    function getCurrentMeeting() { return allMeetingsData[currentMeetingIdx] || null; }
    function getPickKey(meetingId, raceNo, horseNo) { return `${meetingId}_R${raceNo}_${horseNo}`; }

    // ==================== 1. 自動從伺服器或 GitHub 載入數據 ====================
    async function autoLoadFromServer() {
      try {
        const res = await fetch('/api/data');
        if (res.ok) {
          const data = await res.json();
          if (data && data.meetings && data.meetings.length > 0) {
            applyLoadedData(data);
            return;
          }
        }
      } catch (e) {}

      // 備用從 GitHub 讀取
      try {
        const ghRes = await fetch('https://raw.githubusercontent.com/chinhongtsang-ops/horse/main/race_data.json');
        if (ghRes.ok) {
          const data = await ghRes.json();
          applyLoadedData(data);
        }
      } catch (e) {}
    }

    // 觸發高速爬蟲
    let pollTimer = null;
    async function triggerAutoScrape() {
      try {
        const res = await fetch('/api/scrape', { method: 'POST' });
        if (!res.ok) throw new Error();
        document.getElementById('scrape-progress-bar').classList.remove('hidden');
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(checkScrapeStatus, 1500);
      } catch (err) {
        alert('請確認後端伺服器 (python app.py) 正常運行中！');
      }
    }

    async function checkScrapeStatus() {
      try {
        const res = await fetch('/api/scrape/status');
        const st = await res.json();
        document.getElementById('scrape-progress-text').innerText = st.progress || '正在爬取中...';
        if (!st.is_running) {
          clearInterval(pollTimer);
          setTimeout(() => { document.getElementById('scrape-progress-bar').classList.add('hidden'); }, 1500);
          await autoLoadFromServer();
        }
      } catch (e) { clearInterval(pollTimer); }
    }

    function applyLoadedData(data) {
      if (!data || !data.meetings || data.meetings.length === 0) return;
      allMeetingsData = data.meetings;
      currentMeetingIdx = 0;
      currentRace = allMeetingsData[0].race_info[0]?.r || 1;
      expandedHorses = { [`0-${currentRace}-0`]: true };

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('loaded-state').classList.remove('hidden');
      document.getElementById('meeting-nav-wrapper').classList.remove('hidden');
      document.getElementById('race-sticky-nav').classList.remove('hidden');

      syncPicksToMeetings();
      renderAll();
    }

    // ==================== 2. 全港馬匹即時搜尋 (支援所有馬匹，非單次出賽) ====================
    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      const panel = document.getElementById('search-results-panel');
      const clearBtn = document.getElementById('clear-search-btn');

      if (!q) {
        panel.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }
      clearBtn.classList.remove('hidden');
      panel.classList.remove('hidden');

      let matches = [];
      // 搜尋當前所有已爬出的賽事馬匹
      allMeetingsData.forEach((m, mIdx) => {
        Object.keys(m.races || {}).forEach(rNo => {
          (m.races[rNo] || []).forEach((h, hIdx) => {
            const targetStr = `${h.name} ${h.jockey} ${h.trainer} ${h.gear || ''} ${h.horse_id || ''}`.toLowerCase();
            if (targetStr.includes(q)) {
              matches.push({ mIdx, mLabel: m.label, isSim: m.is_simulcast, course: m.course, rNo: Number(rNo), hIdx, h });
            }
          });
        });
      });

      document.getElementById('search-results-title').innerText = `🔍 搜尋「${query}」共找到 ${matches.length} 筆當期出賽紀錄`;
      const listEl = document.getElementById('search-results-list');

      let html = matches.map(item => {
        const rTag = item.isSim ? `${item.course}-R${item.rNo}` : `第 ${item.rNo} 場`;
        return `
          <div onclick="jumpToHorse(${item.mIdx}, ${item.rNo}, ${item.hIdx})" class="bg-slate-900 hover:border-emerald-500 cursor-pointer p-2.5 rounded-xl border border-slate-800 flex justify-between items-center transition">
            <div>
              <span class="text-[10px] text-emerald-400 font-bold block">${item.mLabel} · ${rTag}</span>
              <span class="text-xs font-black text-white">${item.h.no}. ${item.h.name}</span>
              <span class="text-[10px] text-slate-400 block mt-0.5">騎：${item.h.jockey} · 練：${item.h.trainer}</span>
            </div>
            <span class="text-[11px] text-emerald-400 font-bold">跳至 ›</span>
          </div>
        `;
      }).join('');

      // 加入「全港在冊馬匹直通查詢」入口 (防止不在下次出賽表找不到)
      html += `
        <div class="col-span-full bg-slate-950 p-2.5 rounded-xl border border-dashed border-slate-700 flex justify-between items-center text-xs">
          <span class="text-slate-300">🔎 尋找全港所有在冊馬匹（官方專頁）：</span>
          <a href="https://racing.hkjc.com/racing/information/Chinese/Horse/SelectHorse.aspx" target="_blank" class="text-emerald-400 font-bold hover:underline">打開馬會馬匹庫 ›</a>
        </div>
      `;

      listEl.innerHTML = html;
    }

    function clearSearch() {
      document.getElementById('global-search').value = '';
      document.getElementById('search-results-panel').classList.add('hidden');
      document.getElementById('clear-search-btn').classList.add('hidden');
    }

    function jumpToHorse(mIdx, rNo, hIdx) {
      currentMeetingIdx = mIdx;
      currentRace = rNo;
      expandedHorses[`${mIdx}-${rNo}-${hIdx}`] = true;
      renderAll();
      clearSearch();
      setTimeout(() => {
        const card = document.getElementById(`horse-card-${hIdx}`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }

    // ==================== 3. 橫排場次導航與渲染 ====================
    function scrollContainer(id, offset) {
      const el = document.getElementById(id);
      if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function renderMeetingSelector() {
      const cur = getCurrentMeeting();
      if (!cur) return;
      const container = document.getElementById('meeting-selector');
      container.innerHTML = allMeetingsData.map((m, idx) => {
        const isActive = idx === currentMeetingIdx;
        const icon = m.is_simulcast ? '🌏' : '🏇';
        return `
          <button onclick="selectMeeting(${idx})" class="px-2.5 py-1 rounded-lg text-xs font-bold shrink-0 flex items-center space-x-1 transition border ${isActive ? 'bg-emerald-600 text-white border-emerald-400 shadow' : 'bg-slate-900 text-slate-400 border-slate-800'}">
            <span>${icon}</span>
            <span>${m.label}</span>
          </button>
        `;
      }).join('');
    }

    function selectMeeting(idx) {
      currentMeetingIdx = idx;
      const cur = getCurrentMeeting();
      currentRace = cur.race_info[0]?.r || 1;
      renderAll();
    }

    function renderRaceSelector() {
      const cur = getCurrentMeeting();
      if (!cur) return;

      const container = document.getElementById('race-selector-scroll');
      container.innerHTML = (cur.race_info || []).map(r => {
        const isActive = r.r === currentRace;
        const labelText = r.btn_label || (cur.is_simulcast ? `${cur.course}-${r.r}` : `第 ${r.r} 場`);
        return `
          <button id="race-nav-${r.r}" onclick="selectRace(${r.r})" class="px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 transition border ${isActive ? 'bg-emerald-600 text-white border-emerald-400 shadow' : 'bg-slate-900 text-slate-300 border-slate-800'}">
            ${labelText}
          </button>
        `;
      }).join('');

      // 自動將當前場次滑到中間
      setTimeout(() => {
        const activeBtn = document.getElementById(`race-nav-${currentRace}`);
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }, 50);
    }

    function selectRace(r) {
      currentRace = r;
      renderRaceCard();
      renderRaceSelector();
    }

    function toggleDrawer(key) {
      expandedHorses[key] = !expandedHorses[key];
      renderRaceCard();
    }

    function renderRaceCard() {
      const cur = getCurrentMeeting();
      if (!cur) return;

      const raceInfo = cur.race_info.find(r => r.r === currentRace) || cur.race_info[0] || { r: currentRace, name: "賽事", time: "-", cls: "-", dist: "-" };
      const horses = cur.races[String(currentRace)] || [];
      const raceTag = raceInfo.btn_label || `第 ${raceInfo.r} 場`;
      // 在 index.html 中替換原本的馬匹卡片內部 HTML
const ana = h.analysis || { style: "均速", dist_apt: "一般", track_apt: "草地", summary: "" };

return `
<div id="horse-card-${idx}" class="glass-card rounded-xl p-3 border transition ${h.pick === '◎' ? 'border-rose-500/80 shadow-lg' : h.pick === '▲' ? 'border-amber-500/80' : 'border-slate-800'}">
  
  <!-- 基本資料列 -->
  <div class="flex justify-between items-start">
    <div class="flex items-center space-x-2">
      <span class="w-6 h-6 rounded-full bg-slate-800 text-white font-black text-xs flex items-center justify-center border border-slate-600 shrink-0">${h.no}</span>
      <div>
        <div class="flex items-center gap-1.5 flex-wrap">
          <h3 class="font-black text-sm text-white">${h.name}</h3>
          ${h.draw && h.draw !== '-' ? `<span class="text-[10px] bg-slate-800 text-emerald-300 px-1 py-0.2 rounded border border-slate-700">${h.draw}檔</span>` : ''}
          ${h.gear ? `<span class="text-[9px] bg-purple-500/20 text-purple-300 px-1 py-0.2 rounded">${h.gear}</span>` : ''}
        </div>
        <p class="text-[11px] text-slate-400 mt-0.5">
          騎：<strong class="text-slate-200">${h.jockey}</strong> (${h.wt}磅) · 練：${h.trainer} · 評分：${h.rtg}
        </p>
      </div>
    </div>
    ${h.pick ? `<span class="px-1.5 py-0.2 rounded text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">${h.pick}</span>` : ''}
  </div>

  <!-- 【新增】實戰分析彩色標籤組 (跑法 / 路程 / 場地 / 檔位) -->
  <div class="grid grid-cols-3 gap-1.5 mt-2 pt-1.5 border-t border-slate-800/60 text-[10px]">
    <div class="bg-slate-900/80 p-1 rounded text-center border border-slate-800">
      <span class="text-slate-400 block text-[9px]">擅長跑法</span>
      <strong class="text-amber-400">${ana.style}</strong>
    </div>
    <div class="bg-slate-900/80 p-1 rounded text-center border border-slate-800">
      <span class="text-slate-400 block text-[9px]">場地性能</span>
      <strong class="text-emerald-400">${ana.track_apt}</strong>
    </div>
    <div class="bg-slate-900/80 p-1 rounded text-center border border-slate-800">
      <span class="text-slate-400 block text-[9px]">同程考驗</span>
      <strong class="text-sky-300">${ana.dist_apt}</strong>
    </div>
  </div>

  <!-- 【新增】資深馬迷快速點評 -->
  <p class="mt-2 text-[11px] text-slate-300 bg-slate-950/80 p-2 rounded-lg border border-slate-800/80 leading-relaxed">
    💡 <strong class="text-emerald-400">實戰點評：</strong>${ana.summary || '近戰持續提升狀態，需留意檔位與起步節奏。'}
  </p>

  <!-- 往績/晨課抽屜 -->
  <button onclick="toggleDrawer('${key}')" class="mt-2 w-full bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-lg py-1 px-2.5 flex justify-between items-center text-[10px] font-bold text-emerald-400">
    <span>📊 往績 (${(h.past_runs||[]).length}) · ⏱️ 晨課 (${(h.trackwork||[]).length}) · 🎬 片庫</span>
    <span>${isOpen ? '▲ 收起' : '▼ 展開詳情'}</span>
  </button>
  ...

      // 精準頭條：不再每場都是董事盃
      document.getElementById('current-race-header').innerHTML = `
        <div>
          <span class="text-[10px] text-emerald-400 font-bold block">${cur.venue} · ${raceTag} ${raceInfo.time !== '-' ? '· ' + raceInfo.time + ' 開跑' : ''}</span>
          <h2 class="text-sm font-black text-white mt-0.5">${raceInfo.name} ${raceInfo.cls !== '-' ? '(' + raceInfo.cls + ')' : ''}</h2>
        </div>
        <div class="text-right shrink-0">
          <span class="bg-slate-900 px-2 py-1 rounded text-xs font-bold text-slate-200 border border-slate-700">${raceInfo.dist} · ${horses.length} 匹</span>
        </div>
      `;

      // 更新本場心水標記提示
      const currentPicks = horses.filter(h => h.pick).map(h => `${h.no}.${h.name} (${h.pick})`).join(', ');
      document.getElementById('stat-current-picks').innerText = currentPicks || "未標記";

      const list = document.getElementById('horse-list');
      list.innerHTML = horses.map((h, idx) => {
        const key = `${currentMeetingIdx}-${currentRace}-${idx}`;
        const isOpen = !!expandedHorses[key];

        const runsHtml = (h.past_runs || []).map(run => `
          <tr class="border-b border-slate-800/60 text-[10px]">
            <td class="py-1"><span class="w-3.5 h-3.5 rounded-full inline-flex items-center justify-center font-bold ${run.place==='1'?'place-1':run.place==='2'?'place-2':run.place==='3'?'place-3':'bg-slate-800 text-slate-300'}">${run.place}</span></td>
            <td class="py-1 text-slate-400">${run.date}</td>
            <td class="py-1 text-white">${run.track} ${run.dist}</td>
            <td class="py-1 text-slate-300">${run.draw}檔</td>
            <td class="py-1 font-mono text-emerald-400">${run.pos}</td>
            <td class="py-1 text-slate-300">${run.lbw}</td>
            <td class="py-1 text-right">${run.replay_url ? `<a href="${run.replay_url}" target="_blank" class="text-amber-400 font-bold">▶片</a>` : '-'}</td>
          </tr>
        `).join('');

        const twHtml = (h.trackwork || []).map(tw => `
          <div class="bg-slate-950 p-1.5 rounded border border-slate-800/80 text-[10px] flex justify-between">
            <span class="text-slate-300">${tw.date} · ${tw.type} (${tw.rider})</span>
            <span class="font-mono text-amber-300 font-bold">${tw.time}</span>
          </div>
        `).join('');

        return `
        <div id="horse-card-${idx}" class="glass-card rounded-xl p-3 border transition ${h.pick === '◎' ? 'border-rose-500/80' : h.pick === '▲' ? 'border-amber-500/80' : 'border-slate-800'}">
          <div class="flex justify-between items-start">
            <div class="flex items-center space-x-2">
              <span class="w-6 h-6 rounded-full bg-slate-800 text-white font-black text-xs flex items-center justify-center border border-slate-600 shrink-0">${h.no}</span>
              <div>
                <div class="flex items-center gap-1.5">
                  <h3 class="font-black text-sm text-white">${h.name}</h3>
                  ${h.draw && h.draw !== '-' ? `<span class="text-[10px] bg-slate-800 text-emerald-300 px-1 py-0.2 rounded border border-slate-700">${h.draw}檔</span>` : ''}
                  ${h.gear ? `<span class="text-[9px] bg-purple-500/20 text-purple-300 px-1 py-0.2 rounded">${h.gear}</span>` : ''}
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5">騎：<strong class="text-slate-200">${h.jockey}</strong> (${h.wt}) · 練：${h.trainer} · 分：${h.rtg}</p>
              </div>
            </div>
            ${h.pick ? `<span class="px-1.5 py-0.2 rounded text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">${h.pick}</span>` : ''}
          </div>

          <!-- 往績/晨課抽屜 -->
          <button onclick="toggleDrawer('${key}')" class="mt-2 w-full bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-lg py-1 px-2.5 flex justify-between items-center text-[10px] font-bold text-emerald-400">
            <span>📊 往績 (${(h.past_runs||[]).length}) · ⏱️ 晨課 (${(h.trackwork||[]).length}) · 🎬 片庫</span>
            <span>${isOpen ? '▲ 收起' : '▼ 展開'}</span>
          </button>

          ${isOpen ? `
            <div class="mt-2 pt-2 border-t border-slate-800 space-y-2">
              <div class="grid grid-cols-3 gap-1 text-[10px]">
                <a href="${h.videos?.bt_video || '#'}" target="_blank" class="bg-indigo-600/20 text-indigo-300 py-1 rounded text-center">🐎 試閘片</a>
                <a href="${h.videos?.last_race_replay || '#'}" target="_blank" class="bg-rose-600/20 text-rose-300 py-1 rounded text-center">▶️ 上仗片</a>
                <a href="${h.videos?.patrol_video || '#'}" target="_blank" class="bg-amber-600/20 text-amber-300 py-1 rounded text-center">🎥 走位片</a>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <tbody>${runsHtml || '<tr><td class="text-slate-500 text-[10px] py-1">暫無本地往績</td></tr>'}</tbody>
                </table>
              </div>
              <div class="space-y-1">${twHtml || '<p class="text-slate-500 text-[10px]">暫無晨課資料</p>'}</div>
            </div>
          ` : ''}

          <!-- 心水標記按鈕 -->
          <div class="mt-2 flex items-center justify-between pt-1.5 border-t border-slate-800/60">
            <span class="text-[10px] text-slate-400">心水標記：</span>
            <div class="flex space-x-1">
              ${['◎ 本命', '○ 配腳', '▲ 黑馬'].map(tag => {
                const sym = tag.split(' ')[0];
                const isSelected = h.pick === sym;
                return `<button onclick="togglePick(${currentRace}, ${idx}, '${sym}')" class="px-2 py-0.5 rounded text-[10px] font-bold ${isSelected ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'}">${tag}</button>`;
              }).join('')}
            </div>
          </div>
        </div>
      `}).join('');
    }

    // ==================== 4. 心水飛與跨裝置同步 ====================
    async function togglePick(raceNo, horseIdx, symbol) {
      const cur = getCurrentMeeting();
      if (!cur) return;
      const list = cur.races[String(raceNo)];
      if (!list || !list[horseIdx]) return;

      const horse = list[horseIdx];
      horse.pick = horse.pick === symbol ? "" : symbol;

      const pk = getPickKey(cur.id, raceNo, horse.no);
      if (horse.pick) userPicksMap[pk] = horse.pick;
      else delete userPicksMap[pk];

      localStorage.setItem('horse_pro_picks', JSON.stringify(userPicksMap));
      updatePickBadge();
      renderRaceCard();

      if (currentUser) {
        try {
          await fetch('/api/sync_picks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser.username, pin: currentUser.pin, picks: userPicksMap })
          });
        } catch (e) {}
      }
    }

    function updatePickBadge() {
      let total = 0;
      allMeetingsData.forEach(m => {
        Object.keys(m.races || {}).forEach(r => {
          (m.races[r] || []).forEach(h => { if (h.pick) total++; });
        });
      });
      document.getElementById('stat-total-badge').innerText = total;
    }

    function syncPicksToMeetings() {
      allMeetingsData.forEach(m => {
        Object.keys(m.races || {}).forEach(r => {
          (m.races[r] || []).forEach(h => {
            const pk = getPickKey(m.id, r, h.no);
            h.pick = userPicksMap[pk] || h.pick || "";
          });
        });
      });
      updatePickBadge();
    }

    function showMyPicksModal() {
      const modal = document.getElementById('picks-modal');
      const content = document.getElementById('picks-modal-content');
      let html = '';
      allMeetingsData.forEach((m, mIdx) => {
        Object.keys(m.races || {}).forEach(r => {
          (m.races[r] || []).forEach((h, hIdx) => {
            if (h.pick) {
              const rPrefix = m.is_simulcast ? `${m.course}-R${r}` : `第 ${r} 場`;
              html += `
                <div onclick="closeMyPicksModal(); jumpToHorse(${mIdx}, ${r}, ${hIdx});" class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                  <div>
                    <span class="text-[10px] text-slate-400 block">${m.label} · ${rPrefix}</span>
                    <span class="font-bold text-white text-xs">${h.no}號 ${h.name}</span> <span class="text-[10px] text-slate-400">(${h.jockey})</span>
                  </div>
                  <span class="px-2 py-0.5 bg-rose-500/20 text-rose-300 rounded font-bold text-xs">${h.pick}</span>
                </div>`;
            }
          });
        });
      });
      content.innerHTML = html || '<p class="text-slate-400 text-center py-4">暫時未標記任何心水！</p>';
      modal.classList.remove('hidden');
    }
    function closeMyPicksModal() { document.getElementById('picks-modal').classList.add('hidden'); }

    // ==================== 5. 帳號登入 ====================
    function updateUserUI() {
      const label = document.getElementById('user-display-label');
      const logoutBtn = document.getElementById('btn-logout');
      if (currentUser) {
        label.innerText = `👤 ${currentUser.display_name}`;
        logoutBtn.classList.remove('hidden');
      } else {
        label.innerText = '👤 登入';
        logoutBtn.classList.add('hidden');
      }
    }

    function openLoginModal() {
      if (currentUser) document.getElementById('login-username').value = currentUser.username;
      document.getElementById('login-modal').classList.remove('hidden');
    }
    function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }

    async function submitLogin() {
      const username = document.getElementById('login-username').value.trim();
      const pin = document.getElementById('login-pin').value.trim();
      if (!username || !pin) return alert('請輸入帳號與密碼');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, pin })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        currentUser = { username: data.username, display_name: data.display_name, pin };
        userPicksMap = { ...userPicksMap, ...(data.picks || {}) };
        localStorage.setItem('horse_pro_user', JSON.stringify(currentUser));
        localStorage.setItem('horse_pro_picks', JSON.stringify(userPicksMap));

        syncPicksToMeetings();
        updateUserUI();
        renderAll();
        closeLoginModal();
        alert('✅ 登入成功！心水已同步');
      } catch (e) {
        // 單機本地模式
        currentUser = { username, display_name: username, pin };
        localStorage.setItem('horse_pro_user', JSON.stringify(currentUser));
        updateUserUI();
        closeLoginModal();
      }
    }

    function logoutUser() {
      currentUser = null;
      localStorage.removeItem('horse_pro_user');
      updateUserUI();
      closeLoginModal();
    }

    function renderAll() {
      renderMeetingSelector();
      renderRaceSelector();
      renderRaceCard();
    }

    // 初始化啟動
    updateUserUI();
    autoLoadFromServer();
  </script>
